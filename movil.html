<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0f0d">
  <title>Umbral — Exploración</title>
  <style>
    :root {
      --bg: #101210;
      --panel: rgba(14, 17, 15, 0.7);
      --ink: #f1efe9;
      --gold: #e4b976;
      --muted: #c8d0c4;
      --accent: #d9a15a;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      display: block; width: 100vw; height: 100vh;
      background: linear-gradient(#7d7f72, #595a50);
    }

    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
    }

    .brand {
      position: absolute; top: max(20px, env(safe-area-inset-top)); left: 18px;
      font-size: .75rem; letter-spacing: .28em; text-transform: uppercase;
      color: var(--ink); opacity: .9;
    }

    .brand small {
      display: block; letter-spacing: .18em; margin-top: 6px; opacity: .7; font-size: .58rem;
    }

    .help {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(241, 239, 233, 0.8); background: rgba(9, 10, 10, 0.2);
      padding: .55rem .85rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.09);
      backdrop-filter: blur(6px);
    }

    .crosshair {
      position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%);
      opacity: .8;
    }
    .crosshair::before,
    .crosshair::after {
      content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.7);
    }
    .crosshair::before { width: 2px; height: 18px; }
    .crosshair::after { width: 18px; height: 2px; }

    #ui {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
    }

    #pickup, #shoot {
      pointer-events: auto; position: absolute; right: 24px; bottom: 28px;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
      background: rgba(18, 20, 18, 0.85); color: var(--ink);
      padding: .8rem 1.1rem; font-size: .9rem; font-weight: 600;
      box-shadow: 0 10px 28px rgba(0,0,0,.28); cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    #pickup:hover, #shoot:hover {
      transform: translateY(-1px);
      border-color: rgba(228, 185, 118, 0.48);
      background: rgba(26, 29, 26, 0.9);
    }

    #shoot {
      right: 240px;
    }

    #pickup[hidden], #shoot[hidden] {
      display: none !important;
    }

    #notice {
      position: fixed; left: 50%; bottom: 95px; transform: translateX(-50%) translateY(10px);
      background: rgba(14, 17, 15, 0.82); color: var(--ink); font-size: .82rem;
      letter-spacing: .08em; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: .6rem .9rem; opacity: 0; transition: opacity .2s ease, transform .2s ease;
      z-index: 5; pointer-events: none;
    }

    #notice.visible {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    #overlay {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: radial-gradient(circle at center, rgba(18, 18, 15, 0.48), rgba(6,8,8,0.85));
      padding: 24px;
    }

    #overlay.hidden {
      display: none;
    }

    .card {
      width: min(520px, 90vw); background: rgba(17, 18, 17, 0.88);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 22px;
      padding: 30px 26px 22px; box-shadow: 0 30px 80px rgba(0,0,0,.48);
    }

    .eyebrow {
      display: inline-block; font-size: .72rem; letter-spacing: .24em; text-transform: uppercase;
      color: var(--gold); opacity: .9; margin-bottom: 10px;
    }

    h1 {
      margin: 0; font-weight: 700; line-height: 1.04; font-size: clamp(2rem, 6vw, 4.1rem);
      letter-spacing: -.05em;
    }

    .desc {
      color: rgba(241, 239, 233, 0.78); margin: 18px 0 24px; line-height: 1.6;
      font-size: 1rem;
    }

    #start {
      appearance: none; border: none; border-radius: 14px; padding: .9rem 1.25rem;
      background: linear-gradient(135deg, #e4b976, #d39a4d); color: #171410;
      font-weight: 800; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 18px 30px rgba(212,151,75,.28);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="brand">Umbral<small>Recorrido libre</small></div>
    <div class="help">WASD · Mira con el ratón · E recoger · clic disparar</div>
    <div class="crosshair" aria-hidden="true"></div>
  </div>

  <div id="ui">
    <button id="pickup" type="button" hidden>Recoger pistola (E)</button>
    <button id="shoot" type="button" hidden>Disparar</button>
  </div>

  <div id="notice" role="status" aria-live="polite"></div>

  <div id="overlay">
    <main class="card">
      <div class="eyebrow">Exploración en primera persona</div>
      <h1>Entre la luz<br>y el silencio.</h1>
      <p class="desc">Recorre la sala de máquinas. Mira al cadáver y al arma caída, aproxímate y pulsa E para recogerla.</p>
      <button id="start" type="button">Entrar</button>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    const THREE = await import('three');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7d7f72);
    scene.fog = new THREE.FogExp2(0x7d7f72, 0.021);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, 100);
    camera.rotation.order = 'YXZ';
    camera.position.set(0, 1.65, 6.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const roomMat = new THREE.MeshStandardMaterial({ color: 0x9ea092, roughness: 0.9, metalness: 0.08 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x4d4a42, roughness: 0.95, metalness: 0.02 });
    const darkMetal = new THREE.MeshStandardMaterial({ color: 0x3a3f3d, roughness: 0.7, metalness: 0.7 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x644b35, roughness: 0.85 });
    const clothMat = new THREE.MeshStandardMaterial({ color: 0x4c5d52, roughness: 0.9 });
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x2c3032, roughness: 0.4, metalness: 0.9 });
    const steelMat = new THREE.MeshStandardMaterial({ color: 0x98a0a0, roughness: 0.45, metalness: 0.9 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xd1a88d, roughness: 0.9 });
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0x6d7f72, roughness: 0.9 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x31363b, roughness: 0.9 });
    const fleshMat = new THREE.MeshStandardMaterial({ color: 0xb88f7a, roughness: 0.95 });

    const floor = new THREE.Mesh(new THREE.BoxGeometry(18, 0.32, 20), floorMat);
    floor.position.set(0, -0.16, 0);
    floor.receiveShadow = true;
    scene.add(floor);

    const wallBack = new THREE.Mesh(new THREE.BoxGeometry(18, 6, 0.35), roomMat);
    wallBack.position.set(0, 3, -10);
    wallBack.receiveShadow = true;
    scene.add(wallBack);

    const wallFront = new THREE.Mesh(new THREE.BoxGeometry(18, 6, 0.35), roomMat);
    wallFront.position.set(0, 3, 10);
    scene.add(wallFront);

    const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.35, 6, 20), roomMat);
    wallLeft.position.set(-9, 3, 0);
    scene.add(wallLeft);

    const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.35, 6, 20), roomMat);
    wallRight.position.set(9, 3, 0);
    scene.add(wallRight);

    const windowMat = new THREE.MeshStandardMaterial({
      color: 0x9fb8ba,
      emissive: 0x4f7c86,
      emissiveIntensity: 0.55,
      transparent: true,
      opacity: 0.72,
      roughness: 0.2,
      metalness: 0.1
    });

    for (const z of [-5, 0, 5]) {
      const pane = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.8, 2.2), windowMat);
      pane.position.set(-8.8, 4.3, z);
      scene.add(pane);
    }

    const sun = new THREE.DirectionalLight(0xffe2b3, 2.9);
    sun.position.set(-5, 8, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -12;
    scene.add(sun);

    const workbench = new THREE.Group();
    const benchTop = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.18, 0.9), woodMat);
    benchTop.position.set(4.8, 1.2, -8.2);
    benchTop.castShadow = true; benchTop.receiveShadow = true;
    workbench.add(benchTop);

    for (const x of [3.45, 6.15]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.1, 0.14), darkMetal);
      leg.position.set(x, 0.55, -8.2);
      leg.castShadow = true;
      workbench.add(leg);
    }
    scene.add(workbench);

    const crate = new THREE.Group();
    const crateBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 1.1), woodMat);
    crateBody.position.set(-4.2, 0.45, -6.8);
    crateBody.castShadow = true; crateBody.receiveShadow = true;
    crate.add(crateBody);
    scene.add(crate);

    const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.28, 0.9), woodMat);
    sofaBase.position.set(5.1, 0.34, 5);
    sofaBase.castShadow = true; sofaBase.receiveShadow = true;
    scene.add(sofaBase);

    for (const x of [3.95, 6.25]) {
      for (const z of [4.65, 5.35]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.36, 0.12), darkMetal);
        leg.position.set(x, 0.18, z);
        leg.castShadow = true;
        scene.add(leg);
      }
    }

    const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.82, 0.22), clothMat);
    sofaBack.position.set(5.1, 1.03, 5.42);
    sofaBack.castShadow = true; sofaBack.receiveShadow = true;
    scene.add(sofaBack);

    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 7.6, 18), darkMetal);
    pipe.rotation.z = Math.PI / 2;
    pipe.position.set(0.4, 2.2, -9.55);
    scene.add(pipe);

    function createCorpse() {
      const corpse = new THREE.Group();
      corpse.position.set(-1.7, 0.2, -2.15);
      corpse.rotation.y = 0.55;
      scene.add(corpse);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.74, 0.4), shirtMat);
      torso.position.set(0, 0.78, 0.02);
      torso.rotation.z = 0.08;
      torso.castShadow = true; torso.receiveShadow = true;
      corpse.add(torso);

      const chest = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.32, 0.26), shirtMat);
      chest.position.set(0, 0.92, 0.12);
      chest.castShadow = true;
      corpse.add(chest);

      const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.26, 0.34), pantsMat);
      pelvis.position.set(0, 0.4, 0.04);
      pelvis.castShadow = true;
      corpse.add(pelvis);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.12, 12), skinMat);
      neck.position.set(0, 1.2, 0.02);
      neck.castShadow = true;
      corpse.add(neck);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.34, 0.29), skinMat);
      head.position.set(0, 1.52, -0.06);
      head.scale.set(1.05, 0.85, 1);
      head.castShadow = true;
      corpse.add(head);

      const leftArm = new THREE.Group();
      const lUpper = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.56, 12), shirtMat);
      lUpper.rotation.z = -0.58;
      lUpper.position.set(0.34, 0.88, -0.18);
      leftArm.add(lUpper);

      const lFore = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.5, 12), shirtMat);
      lFore.rotation.z = -0.82;
      lFore.position.set(0.66, 0.58, -0.34);
      leftArm.add(lFore);

      const lHand = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.12, 0.18), fleshMat);
      lHand.position.set(0.88, 0.35, 0.14);
      leftArm.add(lHand);
      corpse.add(leftArm);

      const rightArm = new THREE.Group();
      const rUpper = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.56, 12), shirtMat);
      rUpper.rotation.z = 0.8;
      rUpper.position.set(-0.4, 0.82, -0.1);
      rightArm.add(rUpper);

      const rFore = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.53, 12), shirtMat);
      rFore.rotation.z = 1.05;
      rFore.position.set(-0.73, 0.52, 0.12);
      rightArm.add(rFore);

      const rHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.16), fleshMat);
      rHand.position.set(-0.96, 0.24, 0.2);
      rightArm.add(rHand);
      corpse.add(rightArm);

      const leftLeg = new THREE.Group();
      const lThigh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.66, 0.24), pantsMat);
      lThigh.position.set(0.16, -0.06, 0.5);
      lThigh.rotation.z = 0.1;
      leftLeg.add(lThigh);

      const lShin = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.75, 14), pantsMat);
      lShin.rotation.x = Math.PI / 2;
      lShin.position.set(0.18, -0.52, 0.72);
      leftLeg.add(lShin);

      const lFoot = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.46), pantsMat);
      lFoot.position.set(0.21, -0.9, 0.9);
      leftLeg.add(lFoot);
      corpse.add(leftLeg);

      const rightLeg = new THREE.Group();
      const rThigh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.66, 0.24), pantsMat);
      rThigh.position.set(-0.18, -0.06, 0.55);
      rThigh.rotation.z = -0.1;
      rightLeg.add(rThigh);

      const rShin = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.75, 14), pantsMat);
      rShin.rotation.x = Math.PI / 2;
      rShin.position.set(-0.18, -0.52, 0.78);
      rightLeg.add(rShin);

      const rFoot = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.46), pantsMat);
      rFoot.position.set(-0.2, -0.9, 0.96);
      rightLeg.add(rFoot);
      corpse.add(rightLeg);

      return corpse;
    }

    const corpse = createCorpse();

    function createGun() {
      const gun = new THREE.Group();

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.15, 0.2), gunMat);
      body.position.set(0, 0.1, 0);
      body.castShadow = true;
      gun.add(body);

      const slide = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.12), steelMat);
      slide.position.set(0.05, 0.18, 0.02);
      slide.castShadow = true;
      gun.add(slide);

      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.28, 0.16), gunMat);
      grip.position.set(-0.12, -0.09, 0);
      grip.rotation.z = -0.2;
      grip.castShadow = true;
      gun.add(grip);

      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 18), steelMat);
      barrel.rotation.z = Math.PI / 2;
      barrel.position.set(0.42, 0.11, 0);
      barrel.castShadow = true;
      gun.add(barrel);

      const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.12, 18), darkMetal);
      muzzle.rotation.z = Math.PI / 2;
      muzzle.position.set(0.82, 0.11, 0);
      muzzle.castShadow = true;
      gun.add(muzzle);

      return gun;
    }

    const pistol = createGun();
    pistol.position.set(-0.9, 0.08, -2.78);
    pistol.rotation.y = 0.42;
    scene.add(pistol);

    const heldGun = createGun();
    heldGun.scale.set(0.92, 0.92, 0.92);
    heldGun.rotation.set(-0.18, 0.1, -0.28);
    heldGun.position.set(0.38, -0.38, -0.7);

    const heldRig = new THREE.Group();
    camera.add(heldRig);
    heldRig.visible = false;
    heldRig.add(heldGun);

    const flashLight = new THREE.PointLight(0xffd597, 0, 8, 1.8);
    flashLight.position.set(0.4, -0.2, -1.2);
    camera.add(flashLight);

    const flashBulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xf7d49a, transparent: true, opacity: 0.7 })
    );
    flashBulb.position.set(0.42, -0.25, -1.1);
    camera.add(flashBulb);
    flashBulb.visible = false;

    const pickupButton = document.getElementById('pickup');
    const shootButton = document.getElementById('shoot');
    const startButton = document.getElementById('start');
    const notice = document.getElementById('notice');
    const overlay = document.getElementById('overlay');

    let active = false;
    let hasPistol = false;
    let lastShot = 0;
    let yaw = 0;
    let pitch = 0;
    const keys = new Set();
    let noticeTimer = null;

    function showNotice(text) {
      notice.textContent = text;
      notice.classList.add('visible');
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => notice.classList.remove('visible'), 1500);
    }

    function updateButtons() {
      const closeEnough = !hasPistol && camera.position.distanceTo(pistol.position) < 2.35;
      pickupButton.hidden = !closeEnough;
      shootButton.hidden = !hasPistol;
    }

    function pickUp() {
      if (!active) return;
      if (hasPistol) return;
      const closeEnough = camera.position.distanceTo(pistol.position) < 2.35;
      if (!closeEnough) {
        showNotice('Acércate a la pistola para recogerla.');
        return;
      }
      hasPistol = true;
      pistol.visible = false;
      heldRig.visible = true;
      showNotice('Pistola recogida.');
      updateButtons();
    }

    function shoot() {
      if (!active || !hasPistol) return;
      const now = performance.now();
      if (now - lastShot < 280) return;
      lastShot = now;
      heldGun.position.y = -0.46;
      flashLight.intensity = 7;
      flashBulb.visible = true;
      setTimeout(() => {
        heldGun.position.y = -0.38;
        flashLight.intensity = 0;
        flashBulb.visible = false;
      }, 80);
      showNotice('¡Bang!');
    }

    startButton.addEventListener('click', () => {
      active = true;
      overlay.classList.add('hidden');
      if (renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();
      updateButtons();
    });

    pickupButton.addEventListener('click', pickUp);
    shootButton.addEventListener('click', shoot);
    shootButton.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      shoot();
    });

    document.addEventListener('keydown', (event) => {
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
        keys.add(event.code);
        if (event.code.startsWith('Arrow')) event.preventDefault();
      }
      if (event.code === 'KeyE') pickUp();
    });

    document.addEventListener('keyup', (event) => {
      keys.delete(event.code);
    });

    document.addEventListener('mousemove', (event) => {
      if (active && document.pointerLockElement === renderer.domElement) {
        yaw -= event.movementX * 0.0022;
        pitch = THREE.MathUtils.clamp(pitch - event.movementY * 0.0019, -1.4, 1.4);
        camera.rotation.set(pitch, yaw, 0);
      }
    });

    renderer.domElement.addEventListener('click', () => {
      if (active && hasPistol && document.pointerLockElement === renderer.domElement) {
        shoot();
      }
    });

    function movePlayer(dt) {
      if (!active) return;

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const move = new THREE.Vector3();

      if (keys.has('KeyW') || keys.has('ArrowUp')) move.add(forward);
      if (keys.has('KeyS') || keys.has('ArrowDown')) move.sub(forward);
      if (keys.has('KeyA') || keys.has('ArrowLeft')) move.sub(right);
      if (keys.has('KeyD') || keys.has('ArrowRight')) move.add(right);

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(3.8 * dt);
        const nextPos = camera.position.clone().add(move);
        if (Math.abs(nextPos.x) < 8.2 && Math.abs(nextPos.z) < 8.8) {
          camera.position.add(move);
        }
      }
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);
      movePlayer(dt);
      updateButtons();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
      renderer.setSize(innerWidth, innerHeight);
    });

    window.addEventListener('blur', () => keys.clear());

    updateButtons();
    animate();
  </script>
</body>
</html>
